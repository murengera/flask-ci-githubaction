name: Reusable Deployment Workflows
on:
  workflow_call:
    inputs:
     application_name:
      required: true
      type: string

    run_security_scan:
      required: true
      type: boolean
    
    replicas:
     required: true
     type: number

jobs:
  deploy-application-job:
    runs-on: ubuntu-latest
    steps:
     - name: Display deployment parementers
       run: |
         echo "Application Name: ${{ inputs.application_name }}"
         echo "Run security scan: ${{ inputs.run_security_scan }}"
         echo "Replicas: ${{ inputs.replicas }}"

     - name: security scan validation
       if: ${{ inputs.run_security_scan }}
       run: |
         echo "Running security scan validation..."
         echo "Security scan completed successfully."
         
     - name: deploy application
       run: |
         echo "Deploying application..."
         echo "Application deployed successfully."
     - name: deploy completed
       run: |
         echo "Deploy completed successfully."
         

         

     

      
      
  
        
  

      
