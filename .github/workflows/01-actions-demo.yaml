name: Dalton Flask Build  Publish Workflows

on:
  push:
    branches:
      - main
      - feature/*
    paths:
      - app/**
      - .github/workflows/**

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  APPLICATION_NAME: cwj-flask-app
  DOCKERHUBUSERNAME: daltonbigirimana5

jobs:
  flask-build-test-publish:
    runs-on: ubuntu-latest

    if: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'feature/')) || (contains(github.event.pull_request.title, '[WIP]')) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUBUSERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: ${{ env.DOCKERHUBUSERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run container
        run: |
          docker run -d -p 5000:5000 --name flask-container $DOCKERHUBUSERNAME/$APPLICATION_NAME:$IMAGE_TAG

      - name: Smoke Test Application
        run: |
          sleep 5
          curl --fail http://localhost:5000
          curl --fail http://localhost:5000/health

      - name: Push docker image to Dockerhub
        if: ${{ success() }}
        run: |
          docker push $DOCKERHUBUSERNAME/$APPLICATION_NAME:$IMAGE_TAG

      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs flask-container

      - name: Cleanup Docker Resources
        if: ${{ always() }}
        run: |
          docker stop flask-container 2>/dev/null || true
          docker rm flask-container 2>/dev/null || true
          docker rmi $DOCKERHUBUSERNAME/$APPLICATION_NAME:$IMAGE_TAG 2>/dev/null || true