name: production workflow trigger Demo

on:
  push:
    branches:
      - "devloper"
      - "feature/*"

    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/*"
    
  pull_request:
    types: [opened, reopened, closed, ready_for_review, synchronize]
    branches:
      - "main"

jobs:
  test:
    name: Run Lint and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: pytest -v

  build-and-push:
    name: Build, Smoke Test, and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t my-flask-app .
      - name: Run Container & Smoke Test
        run: |
          docker run -d -p 5000:5000 --name my-flask-container my-flask-app
          sleep 5
          curl -f http://localhost:5000
          docker stop my-flask-container
          docker rm my-flask-container
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUBUSERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Tag and Push Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUBUSERNAME }}
        run: |
          CLEAN_USER=$(echo "$DOCKER_USER" | tr -d '[:space:]')
          IMAGE_NAME="${CLEAN_USER}/my-flask-app"
          docker tag my-flask-app "${IMAGE_NAME}:latest"
          docker tag my-flask-app "${IMAGE_NAME}:${{ github.sha }}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"
