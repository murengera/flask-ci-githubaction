name: cwvj Flask Build Test Publish Workflow

on:
  push:
    branches:
      -main
      -feature/*
    paths:
     - app/**
     - .github/workflows/**

    pull_request:
      branches:
       -main
       
      types:
       - opened
       - synchronize
       - reopened
  env:
   APPLICATION_NAME: cwj-flask-app
   DOCKER_USERNAME: daltonbigirimana5
  
  jobs:
   flask-build-test-publish:
      runs-on: ubuntu-latest

      if: ${{ (github.event_name=='push' && startsWith(github.ref,'feature/')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && !contains(github.event.pull_request.title,'[WIP]')) }}

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v6
        
        - name : Generate Dyanamic Image Tag
          run : echo "IMAGE_TAKE =v ${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_ENV

        - name: Dispaly Build Information 
          run: |
           echo "Application : $APPLICATION_NAME"
          
        - name: Login to Dockerhub
          uses: docker/login-action@v3
          with:
            username: ${{env.DOCKER_USERNAME}}
            password: ${{ secrets.DOCKER_HUB_TOKEN}}
        - name: Builde Docker Image
          uses: docker/build-push-action@v7
          with:
            context: ./app
            push: false
            tag: ${{env.DOCKER_USERNAME}}/ ${{env.APPLICATION_NAME}}:${{env.IMAGE_TAG}}
        
        - name: Run container
          run : |
            docker run -d -p 5000:5000 --name flask-container $DOCKER_USERNAME/$APPLICATION_NAME:$IMAGE_TAG

        - name: Smoke Test Application
          run: 
            sleep 5
            curl  --fail https://localhost:5000

        - name: Push docker image to Dockerhub
          if: {{success()}}

          run: |
            docker push $DOCKER_USERNAME/$APPLICATION_NAME:$IMAGE_TAG

        - name :  Collect Container Logs

          if: ${{failure() }}

          run: |
            docker logs flask-container

        - name: Cleanup Docker Resources

          if: always()

          run: |
            docker stop flask-container 2>/dev/null || true
            docker rm flask-container 2>/dev/null || true
            docker rmi $DOCKER_USERNAME/$APPLICATION_NAME:${{env.IMAGE_TAG}} 2>/dev/null || true



          
        
    
    