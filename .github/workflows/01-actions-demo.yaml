name: Flask CI Pipeline

on: push

jobs:
  flask-ci-job:   
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-flask-app .

      - name: Run Docker container & Smoke test
        run: |
          docker run -d -p 5000:5000 --name my-flask-container my-flask-app
          sleep 5
          curl http://localhost:5000

      - name: Login to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUBUSERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Tag and Push to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUBUSERNAME }}
        run: |
          CLEAN_USER=$(echo "$DOCKER_USER" | tr -d '[:space:]')
          docker tag my-flask-app "${CLEAN_USER}/my-flask-app:latest"
          docker push "${CLEAN_USER}/my-flask-app:latest"